name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build-and-test:
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup .NET 8.0
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0.x"

            - name: Restore
              run: dotnet restore TiaMcpServer.sln

            - name: Build
              run: dotnet build TiaMcpServer.sln -m:1 --no-restore --configuration Release /p:UseTiaPortalReferenceStubs=true

            - name: Run tests with coverage
              # Uses the built-in Coverlet collector.
              # We force the output into a specific directory so it's easy to find.
              run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  # Coverlet creates a folder with a random GUID, so we use a wildcard (**)
                  file: ./coverage/**/coverage.cobertura.xml
                  fail_ci_if_error: true
