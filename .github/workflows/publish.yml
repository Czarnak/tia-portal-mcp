name: Publish .NET Global Tool

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 1.2.3 or v1.2.3'
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      # Releases reuse the CI run on main instead of re-running it for the same commit.
      - name: Require passing CI for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $runs = @(gh run list --workflow ci.yml --commit $env:HEAD_SHA --status success --limit 1 --json databaseId | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "Could not query CI runs for $env:HEAD_SHA." }
          if ($runs.Count -eq 0) { throw "CI has not passed for commit $env:HEAD_SHA. Wait for its CI run to succeed, then re-run this release." }
          Write-Host "CI run $($runs[0].databaseId) passed for $env:HEAD_SHA."

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TiaMcpServer.slnx -m:1

      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $releaseTag = $env:REF_NAME
          } else {
            $releaseTag = $env:INPUT_VERSION
          }

          $packageVersion = $releaseTag -replace '^v', ''

          if ($packageVersion -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version '$releaseTag' does not resolve to a valid NuGet package version."
          }

          if (-not $releaseTag.StartsWith('v')) {
            $releaseTag = "v$packageVersion"
          }

          "PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved NuGet package version $packageVersion from release tag $releaseTag"

      - name: Build and Pack
        run: dotnet pack TiaMcpServer/TiaMcpServer.csproj -m:1 -c Release --no-restore -o ./out /p:Version=$env:PACKAGE_VERSION /p:PackageVersion=$env:PACKAGE_VERSION /p:InformationalVersion=$env:PACKAGE_VERSION /p:IncludeSourceRevisionInInformationalVersion=false

      - name: Verify tool package contents
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path ./out -Filter *.nupkg | Select-Object -First 1
          ./scripts/verify-doctor-package.ps1 -PackagePath $pkg.FullName

       # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user:  ${{ secrets.NUGET_USER }}
    
      # Push the package
      - name: NuGet push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $pkg = Get-ChildItem -Path ./out -Filter *.nupkg | Select-Object -First 1
          dotnet nuget push $pkg.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish Standalone Binary
        run: dotnet publish TiaMcpServer/TiaMcpServer.csproj -m:1 -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PackAsTool=false /p:Version=$env:PACKAGE_VERSION /p:PackageVersion=$env:PACKAGE_VERSION /p:InformationalVersion=$env:PACKAGE_VERSION /p:IncludeSourceRevisionInInformationalVersion=false -o ./publish-bin

      - name: Zip Standalone Binary
        run: |
          if (-not (Test-Path ./publish-bin/openness-worker/TiaMcpServer.OpennessWorker.exe)) { throw "Standalone publish is missing openness-worker/TiaMcpServer.OpennessWorker.exe." }
          Compress-Archive -Path ./publish-bin/* -DestinationPath ./out/tia-mcp-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          files: |
            out/*.nupkg
            out/tia-mcp-windows-x64.zip
          generate_release_notes: true
